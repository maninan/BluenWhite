<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flower Smart - Admin Dashboard</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #f0f2f5; margin: 0; padding: 0; color: #050505; }
        .container { max-width: 1000px; margin: 40px auto; padding: 20px; }
        .card { background: white; border-radius: 8px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); padding: 24px; margin-bottom: 24px; }
        h1, h2 { margin-top: 0; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: 500; font-size: 14px; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #ccd0d5; border-radius: 6px; box-sizing: border-box; }
        .btn { background: #1877F2; color: white; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 14px; }
        .btn:hover { background: #166fe5; }
        .btn-danger { background: #E41E3F; }
        .btn-danger:hover { background: #d01835; }
        .hidden { display: none; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab { padding: 10px 20px; background: white; border: 1px solid #ccd0d5; cursor: pointer; border-radius: 6px; font-weight: 500; }
        .tab.active { background: #1877F2; color: white; border-color: #1877F2; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ccd0d5; }
        th { background: #f0f2f5; font-size: 13px; color: #65676B; text-transform: uppercase; }
        .spec-item { display:flex; gap:10px; margin-bottom:10px; }
        .spec-item input { flex: 1; }
    </style>
</head>
<body>

<div class="container" id="loginView">
    <div class="card" style="max-width: 400px; margin: 100px auto;">
        <h2>Admin Login</h2>
        <div class="form-group">
            <label>Username</label>
            <input type="text" id="username" value="admin">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" value="password123">
        </div>
        <button class="btn" style="width:100%" onclick="login()">Login</button>
        <p id="loginError" style="color:red; font-size:14px; display:none;">Invalid credentials</p>
    </div>
</div>

<div class="container hidden" id="dashboardView">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 24px;">
        <h1>Dashboard</h1>
        <button class="btn btn-danger" onclick="logout()">Logout</button>
    </div>

    <div class="tabs">
        <div class="tab active" onclick="switchTab('enquiries')">Enquiries</div>
        <div class="tab" onclick="switchTab('products')">Products</div>
    </div>

    <div id="enquiriesTab" class="card">
        <h2>Recent Enquiries</h2>
        <table>
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Product Interest</th>
                    <th>Message</th>
                </tr>
            </thead>
            <tbody id="enquiriesTableBody"></tbody>
        </table>
    </div>

    <div id="productsTab" class="card hidden">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 16px;">
            <h2>Manage Products</h2>
            <button class="btn" onclick="document.getElementById('addProductForm').classList.toggle('hidden')">+ Add Product</button>
        </div>

        <div id="addProductForm" class="hidden" style="background:#f9f9f9; padding:16px; border-radius:6px; margin-bottom:16px; border:1px solid #ccd0d5;">
            <h3>New Product</h3>
            <div style="display:flex; gap:10px;">
                <div class="form-group" style="flex:1"><label>Key (Unique)</label><input type="text" id="pKey" placeholder="e.g. e8"></div>
                <div class="form-group" style="flex:1"><label>Model</label><input type="text" id="pModel" placeholder="e.g. E8"></div>
            </div>
            <div class="form-group"><label>Name</label><input type="text" id="pName"></div>
            <div class="form-group"><label>Image URL</label><input type="text" id="pImg"></div>
            <div style="display:flex; gap:10px;">
                <div class="form-group" style="flex:1">
                    <label>Category</label>
                    <select id="pCat">
                        <option value="single">Single Floor</option>
                        <option value="double">Double Layer</option>
                        <option value="apple">Apple Cabin</option>
                        <option value="specialty">Specialty</option>
                    </select>
                </div>
                <div class="form-group"><label>Featured?</label><input type="checkbox" id="pFeat" style="margin-top:10px;"></div>
            </div>
            
            <label style="font-weight:500; font-size:14px;">Specs</label>
            <div id="specsContainer"></div>
            <button class="btn" style="background:#65676B; font-size:12px; margin-bottom:16px;" onclick="addSpecField()">+ Add Spec Row</button>
            <br>
            <button class="btn" onclick="saveProduct()">Save Product</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Image</th>
                    <th>Model</th>
                    <th>Name</th>
                    <th>Category</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="productsTableBody"></tbody>
        </table>
    </div>
</div>

<script src="admin.js"></script>
</body>
</html>
