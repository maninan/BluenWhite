<svg width="600" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1877F2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a50c8;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="600" fill="url(#bgGradient)"/>
  
  <!-- Image icon -->
  <circle cx="300" cy="200" r="60" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  <rect x="150" y="250" width="300" height="200" rx="12" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="3"/>
  
  <!-- Placeholder text -->
  <text x="300" y="380" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="middle">
    Product Image
  </text>
  <text x="300" y="420" font-family="Arial, sans-serif" font-size="16" fill="rgba(255,255,255,0.8)" text-anchor="middle">
    Upload Your Image
  </text>
  
  <!-- Dimension text -->
  <text x="300" y="550" font-family="Arial, sans-serif" font-size="14" fill="rgba(255,255,255,0.6)" text-anchor="middle">
    600x600px Recommended
  </text>
</svg>
